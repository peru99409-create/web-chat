name = "web-chat-relay"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# 接続を許可するサイトのURL（カンマ区切り）。https://*.example.pages.dev のように書くと、サブドメインも許可します
ALLOWED_ORIGINS = "https://web-chat-9ne.pages.dev"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# 無料プランでは、SQLite方式のDurable Objectsだけが使えます
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
